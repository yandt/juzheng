<?xml version="1.0" encoding="UTF-8"?>
<!-- 明代文官补子暗纹 tile（纯细线、无填充、小巧分散，适合做织物暗花底纹）
     设计目标：平铺后是精致细金线暗纹，绝不冲淡红底。
     所有元素都是细描边/小点，无大块填充。viewBox 160x160 方形易平铺。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <g fill="none" stroke="#F2C94C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <!-- 中心小仙鹤（纯线描，身体只勾轮廓不填） -->
    <!-- 鹤身轮廓（细长，不闭合填色） -->
    <path d="M 64 86 Q 74 80 84 84 Q 92 88 88 96 Q 78 100 70 96 Q 62 92 64 86"/>
    <!-- 鹈长颈（S形细线） -->
    <path d="M 86 82 Q 94 72 96 60 Q 97 54 92 52"/>
    <!-- 鹤头小圆点 -->
    <circle cx="91" cy="50" r="1.8"/>
    <!-- 喙短线 -->
    <path d="M 93 49 L 98 48"/>
    <!-- 翅膀（两根上扬弧线，无线条感） -->
    <path d="M 76 84 Q 72 74 66 70"/>
    <path d="M 80 82 Q 76 72 70 66"/>
    <!-- 鹤腿（两条细长线） -->
    <path d="M 76 98 L 74 112"/>
    <path d="M 84 98 L 86 112"/>
    <!-- 丹顶点 -->
    <circle cx="90" cy="48" r="1" fill="#F2C94C" stroke="none"/>

    <!-- 四角云纹（纯线条卷曲，无填充） -->
    <!-- 左上云 -->
    <path d="M 28 30 Q 36 26 42 30 Q 46 34 42 38 Q 36 40 32 36 Q 30 34 32 32"/>
    <path d="M 42 38 Q 48 40 50 44"/>
    <!-- 右上云 -->
    <path d="M 118 26 Q 126 22 132 26 Q 136 30 132 34 Q 126 36 122 32 Q 120 30 122 28"/>
    <path d="M 132 34 Q 138 36 140 40"/>
    <!-- 左下云 -->
    <path d="M 28 130 Q 36 126 42 130 Q 46 134 42 138 Q 36 140 32 136 Q 30 134 32 132"/>
    <!-- 右下云 -->
    <path d="M 118 130 Q 126 126 132 130 Q 136 134 132 138 Q 126 140 122 136 Q 120 134 122 132"/>

    <!-- 海水纹（底部细波浪线，单线无填充） -->
    <path d="M 0 150 Q 16 146 32 150 T 64 150 T 96 150 T 128 150 T 160 150"/>
    <path d="M 0 156 Q 16 152 32 156 T 64 156 T 96 156 T 128 156 T 160 156"/>

    <!-- 散落小点（星辰/水珠，增加织物暗花质感） -->
    <circle cx="20" cy="80" r="0.8" fill="#F2C94C" stroke="none"/>
    <circle cx="140" cy="76" r="0.8" fill="#F2C94C" stroke="none"/>
    <circle cx="50" cy="60" r="0.6" fill="#F2C94C" stroke="none"/>
    <circle cx="110" cy="100" r="0.6" fill="#F2C94C" stroke="none"/>
    <circle cx="80" cy="120" r="0.7" fill="#F2C94C" stroke="none"/>
    <circle cx="40" cy="110" r="0.6" fill="#F2C94C" stroke="none"/>
  </g>
</svg>
