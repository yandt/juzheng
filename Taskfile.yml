version: '3'

vars:
  APP_NAME: "juzheng"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    deps:
      - task: build:helper
    cmds:
      - task: "{{.GOOS}}:build"

  build:helper:
    summary: Builds the privileged helper binary (sing-box TUN daemon) and stages it for embedding
    # 按目标平台分发：darwin → juzheng-helper(+plist)；windows → juzheng-helper.exe（交叉编译）。
    cmds:
      - task: "build:helper:{{.GOOS}}"

  build:helper:darwin:
    internal: true
    sources:
      - helper/**/*.go
      - configs/singbox-template.json
      - go.mod
    generates:
      # embed 源在 internal/helperclient/helper-assets（go:embed 相对该包目录，不能用 ..）。
      - internal/helperclient/helper-assets/juzheng-helper
      - internal/helperclient/helper-assets/com.zhanghui.juzheng.helper.plist
    cmds:
      # 编译 macOS helper（带 sing-box 全套 build tags）。
      - rm -f internal/helperclient/helper-assets/juzheng-helper
      - GOOS=darwin go build -tags "{{.HELPER_TAGS}}" -ldflags "-checklinkname=0 -X internal/godebug.defaultGODEBUG=multipathtcp=0" -o internal/helperclient/helper-assets/juzheng-helper ./helper/
      # 同步 plist 到 embed 源目录
      - cp helper/com.zhanghui.juzheng.helper.plist internal/helperclient/helper-assets/
    vars:
      HELPER_TAGS: '{{.HELPER_TAGS | default "singbox,with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0"}}'

  build:helper:windows:
    internal: true
    sources:
      - helper/**/*.go
      - configs/singbox-template.json
      - go.mod
    generates:
      - internal/helperclient/helper-assets/juzheng-helper.exe
    cmds:
      # 交叉编译 Windows helper.exe（sing-box 全套 tags，CGO 关闭，wintun/wireguard-windows 纯 Go）。
      - GOOS=windows GOARCH={{.GOARCH | default "amd64"}} CGO_ENABLED=0 go build -tags "{{.HELPER_TAGS}}" -ldflags "-checklinkname=0 -X internal/godebug.defaultGODEBUG=multipathtcp=0" -o internal/helperclient/helper-assets/juzheng-helper.exe ./helper/
    vars:
      HELPER_TAGS: '{{.HELPER_TAGS | default "singbox,with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,badlinkname,tfogo_checklinkname0"}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
